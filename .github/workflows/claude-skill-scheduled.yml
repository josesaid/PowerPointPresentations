name: Publish Content - 9AM & 4PM CST

on:
  schedule:
    - cron: '0 15 * * *'  # 9 AM CST (15:00 UTC)
    - cron: '0 22 * * *'  # 4 PM CST (22:00 UTC)
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run publication pipeline
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          cd /home/runner/work/PowerPointPresentations/PowerPointPresentations
          python3 -c "
          import sys
          sys.path.insert(0, '.')
          from publish_pipeline import PublishPipeline
          pipeline = PublishPipeline()
          exit_code = pipeline.run()
          sys.exit(exit_code)
          " || echo "Pipeline execution finished"

      - name: Commit and push
        run: |
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          git add temas_post_LinkedIn_usados.txt 2>/dev/null || true
          git commit -m "chore: auto-publish content" || echo "No changes to commit"
          git push origin master || echo "Push failed (expected if no changes)"

      - name: Report success
        if: success()
        run: |
          echo "✅ Publication pipeline completed successfully"
          echo "📌 Check: https://dev.to/said_olano"

      - name: Report failure
        if: failure()
        run: |
          echo "❌ Publication pipeline failed"
          exit 1
