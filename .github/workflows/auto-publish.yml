name: Auto-Publish to dev.to

on:
  schedule:
    - cron: '0 15 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate and Publish
        run: |
          node << 'EOF'
          const https = require('https');
          const fs = require('fs');

          async function req(hostname, path, method, headers, payload) {
            return new Promise((resolve, reject) => {
              const options = { hostname, path, method, headers };
              const r = https.request(options, (res) => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => {
                  console.log(`${hostname} ${path} -> ${res.statusCode}`);
                  resolve({ status: res.statusCode, body: data, headers: res.headers });
                });
              });
              r.on('error', reject);
              if (payload) r.write(payload);
              r.end();
            });
          }

          (async () => {
            try {
              console.log('Step 1: Generate article with Claude...');
              const payload = JSON.stringify({
                model: "claude-opus-4-8",
                max_tokens: 1500,
                messages: [{
                  role: "user",
                  content: `Create a technical blog post about Java. 
                  Return ONLY raw JSON (no markdown):
                  {"title":"Article Title","body_markdown":"# Title\\n\\nContent","tags":["java"]}`
                }]
              });
              
              const res1 = await req('api.anthropic.com', '/v1/messages', 'POST', {
                'x-api-key': process.env.ANTHROPIC_API_KEY,
                'anthropic-version': '2023-06-01',
                'content-type': 'application/json',
                'content-length': Buffer.byteLength(payload)
              }, payload);
              
              if (res1.status !== 200) {
                console.error('Claude error:', res1.body);
                throw new Error('Claude failed');
              }
              
              let jsonText = JSON.parse(res1.body).content[0].text;
              jsonText = jsonText.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
              const article = JSON.parse(jsonText);
              console.log('Generated article:', article.title);
              
              console.log('Step 2: Publish to dev.to...');
              const payload2 = JSON.stringify({
                article: {
                  title: article.title,
                  body_markdown: article.body_markdown,
                  published: true,
                  tags: article.tags || ['java']
                }
              });
              
              console.log('Payload:', payload2.substring(0, 100));
              
              const res2 = await req('dev.to', '/api/articles', 'POST', {
                'api-key': process.env.DEVTO_API_KEY,
                'content-type': 'application/json',
                'content-length': Buffer.byteLength(payload2)
              }, payload2);
              
              console.log('dev.to response:', res2.body);
              
              if (res2.status !== 201) {
                throw new Error(`dev.to ${res2.status}: ${res2.body}`);
              }
              
              const published = JSON.parse(res2.body).article;
              fs.writeFileSync('published.json', JSON.stringify(published));
              console.log('SUCCESS: ' + published.url);
            } catch (e) {
              console.error('FINAL ERROR:', e.message);
              process.exit(1);
            }
          })();
          EOF
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}

      - name: Commit
        if: success()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add published.json || true
          git commit -m "Auto-published" || true
          git push origin master
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
