name: Auto-Publish to dev.to

on:
  schedule:
      - cron: '0 14 * * *'  # 8am CST (14:00 UTC)
          - cron: '0 18 * * *'  # 12pm CST (18:00 UTC)
              - cron: '0 22 * * *'  # 4pm CST (22:00 UTC)
                workflow_dispatch:
                
                jobs:
                  publish:
                      runs-on: ubuntu-latest
                          permissions:
                                contents: write
                                    
                                        steps:
                                              - uses: actions/checkout@v4
                                                      with:
                                                                token: ${{ secrets.GH_PAT }}
                                                                          persist-credentials: true
                                                                                - uses: actions/setup-node@v4
                                                                                        with:
                                                                                                  node-version: '20'
                                                                                                  
                                                                                                        - name: Generate and Publish
                                                                                                                run: |
                                                                                                                          node << 'EOF'
                                                                                                                                    const fs = require('fs');
                                                                                                                                              
                                                                                                                                                        function sanitizeTags(tags) {
                                                                                                                                                                    return tags
                                                                                                                                                                                  .map(tag => tag.toLowerCase().replace(/[^a-z0-9]/g, '').substring(0, 30))
                                                                                                                                                                                                .filter(tag => tag.length > 0)
                                                                                                                                                                                                              .slice(0, 4);
                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                            function cleanJsonResponse(text) {
                                                                                                                                                                                                                                                        text = text.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
                                                                                                                                                                                                                                                                    const start = text.indexOf('{');
                                                                                                                                                                                                                                                                                const end = text.lastIndexOf('}');
                                                                                                                                                                                                                                                                                            if (start === -1 || end === -1) {
                                                                                                                                                                                                                                                                                                          throw new Error('No JSON object found in response');
                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                  return text.substring(start, end + 1);
                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                                                                                                                (async () => {
                                                                                                                                                                                                                                                                                                                                                                            try {
                                                                                                                                                                                                                                                                                                                                                                                          console.log('Step 1: Generate article with Claude...');
                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                      const claudeRes = await fetch('https://api.anthropic.com/v1/messages', {
                                                                                                                                                                                                                                                                                                                                                                                                                                      method: 'POST',
                                                                                                                                                                                                                                                                                                                                                                                                                                                      headers: {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        'x-api-key': process.env.ANTHROPIC_API_KEY,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          'anthropic-version': '2023-06-01',
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            'content-type': 'application/json'
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            body: JSON.stringify({
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              model: "claude-opus-4-8",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                max_tokens: 1500,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  messages: [{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      role: "user",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          content: "Create a technical blog post about Java and Spring Boot. Return ONLY a JSON object with: title, body_markdown, tags (array)"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }]
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            })
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if (!claudeRes.ok) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const err = await claudeRes.text();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      throw new Error(`Claude API error ${claudeRes.status}: ${err}`);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const claudeData = await claudeRes.json();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if (!claudeData.content || !claudeData.content[0]) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              throw new Error('Invalid Claude response');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let jsonText = claudeData.content[0].text;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const cleanJson = cleanJsonResponse(jsonText);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const article = JSON.parse(cleanJson);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!article.title || !article.body_markdown || !Array.isArray(article.tags)) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                throw new Error('Missing required fields');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          article.tags = sanitizeTags(article.tags);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      console.log('✅ Article generated:', article.title);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    console.log('\nStep 2: Publish to dev.to...');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const devtoRes = await fetch('https://dev.to/api/articles', {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                method: 'POST',
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                headers: {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  'api-key': process.env.DEVTO_API_KEY,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    'content-type': 'application/json'
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    body: JSON.stringify({
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      article: {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          title: article.title,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              body_markdown: article.body_markdown,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  published: true,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      tags: article.tags
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        })
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if (!devtoRes.ok) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const err = await devtoRes.text();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  throw new Error(`dev.to error ${devtoRes.status}`);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const devtoData = await devtoRes.json();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const articleUrl = devtoData.article?.url || devtoData.canonical_url || 'https://dev.to/said_olano';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      console.log('✅ Published to dev.to');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    console.log('URL:', articleUrl);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  console.log('\n✅ Pipeline completed successfully');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              fs.writeFileSync('publish_state.json', JSON.stringify({title: article.title, url: articleUrl}, null, 2));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        } catch (e) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      console.error('❌ ERROR:', e.message);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    process.exit(1);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          })();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    EOF
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            env:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      - name: Commit
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if: success()
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                git config user.name "GitHub Actions"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          git config user.email "actions@github.com"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    git add publish_state.json || true
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              git commit -m "docs: Auto-published article" || echo "No changes"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        git push origin master || echo "Push skipped"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                env:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          GITHUB_TOKEN: ${{ secrets.GH_PAT }}name: Auto-Publish to dev.to

on:
  schedule:
    - cron: '0 15 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true  # ← Esto es lo principal
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate and Publish
        run: |
          node << 'EOF'
          const fs = require('fs');
          function sanitizeTags(tags) {
            return tags
              .map(tag => tag.toLowerCase().replace(/[^a-z0-9]/g, '').substring(0, 30))
              .filter(tag => tag.length > 0)
              .slice(0, 4);
          }
          (async () => {
            try {
              console.log('Step 1: Generate article with Claude...');
              
              const claudeRes = await fetch('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: {
                  'x-api-key': process.env.ANTHROPIC_API_KEY,
                  'anthropic-version': '2023-06-01',
                  'content-type': 'application/json'
                },
                body: JSON.stringify({
                  model: "claude-opus-4-8",
                  max_tokens: 1500,
                  messages: [{
                    role: "user",
                    content: "Create a technical blog post about Java. Return ONLY raw JSON: {\"title\":\"...\",\"body_markdown\":\"...\",\"tags\":[\"java\",\"springboot\"]}"
                  }]
                })
              });
              
              if (!claudeRes.ok) throw new Error(`Claude ${claudeRes.status}`);
              const claudeData = await claudeRes.json();
              
              let jsonText = claudeData.content[0].text;
              jsonText = jsonText.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
              const article = JSON.parse(jsonText);
              
              // Sanitize tags
              article.tags = sanitizeTags(article.tags || ['java']);
              
              console.log('Generated:', article.title);
              console.log('Tags:', article.tags.join(', '));
              
              console.log('Step 2: Publish to dev.to...');
              
              const devtoRes = await fetch('https://dev.to/api/articles', {
                method: 'POST',
                headers: {
                  'api-key': process.env.DEVTO_API_KEY,
                  'content-type': 'application/json'
                },
                body: JSON.stringify({
                  article: {
                    title: article.title,
                    body_markdown: article.body_markdown,
                    published: true,
                    tags: article.tags
                  }
                })
              });
              
              console.log('dev.to response:', devtoRes.status);
              
              if (!devtoRes.ok) {
                const err = await devtoRes.text();
                throw new Error(`dev.to ${devtoRes.status}: ${err}`);
              }
              
              const bodyText = await devtoRes.text();
              console.log('Response body:', bodyText.substring(0, 200));
              
              const published = JSON.parse(bodyText);
              const articleData = published.article || published;
              
              fs.writeFileSync('published.json', JSON.stringify(articleData));
              const url = articleData.url || articleData.canonical_url || 'https://dev.to/said_olano';
              console.log('✅ SUCCESS: ' + url);
            } catch (e) {
              console.error('❌ ERROR:', e.message);
              process.exit(1);
            }
          })();
          EOF
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}

      - name: Commit
        if: success()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add published.json || true
          git commit -m "Auto-published article" || echo "No changes to commit"
          git pull --rebase origin master 2>/dev/null || true
          git push --force-with-lease origin master 2>/dev/null || echo "Push skipped"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
