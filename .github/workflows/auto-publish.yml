name: Auto-Publish to dev.to & LinkedIn

on:
  schedule:
    - cron: '0 15 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate and Publish Article
        run: |
          node << 'EOF'
          const https = require('https');
          const fs = require('fs');

          function makeRequest(hostname, path, method, headers, payload) {
            return new Promise((resolve, reject) => {
              const options = { hostname, path, method, headers };
              const req = https.request(options, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  resolve({ statusCode: res.statusCode, body: data });
                });
              });
              req.on('error', reject);
              if (payload) req.write(payload);
              req.end();
            });
          }

          async function generateArticle() {
            const payload = JSON.stringify({
              model: "claude-3-5-sonnet-20241022",
              max_tokens: 1500,
              messages: [{
                role: "user",
                content: `Write a technical blog post about Java and Spring Boot.
Return ONLY JSON: {"title": "...", "body_markdown": "...", "tags": ["java"]}`
              }]
            });

            const headers = {
              'x-api-key': process.env.ANTHROPIC_API_KEY,
              'anthropic-version': '2023-06-01',
              'content-type': 'application/json',
              'content-length': Buffer.byteLength(payload)
            };

            const response = await makeRequest('api.anthropic.com', '/v1/messages', 'POST', headers, payload);
            if (response.statusCode !== 200) {
              throw new Error(`Claude error ${response.statusCode}: ${response.body}`);
            }
            const data = JSON.parse(response.body);
            const article = JSON.parse(data.content[0].text);
            return article;
          }

          async function publishToDevto(article) {
            const payload = JSON.stringify({
              article: {
                title: article.title,
                body_markdown: article.body_markdown,
                published: true,
                tags: article.tags || ['java']
              }
            });

            const headers = {
              'api-key': process.env.DEVTO_API_KEY,
              'content-type': 'application/json',
              'content-length': Buffer.byteLength(payload)
            };

            const response = await makeRequest('dev.to', '/api/articles', 'POST', headers, payload);
            if (response.statusCode !== 201) {
              throw new Error(`dev.to error ${response.statusCode}: ${response.body}`);
            }
            return JSON.parse(response.body).article;
          }

          (async () => {
            try {
              console.log('Generating article...');
              const article = await generateArticle();
              console.log('Publishing to dev.to...');
              const published = await publishToDevto(article);
              console.log('Published: ' + published.url);
              fs.writeFileSync('published.json', JSON.stringify(published));
            } catch (e) {
              console.error('Error:', e.message);
              process.exit(1);
            }
          })();
          EOF
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}

      - name: Commit
        if: success()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add published.json || true
          git commit -m "Auto-published" || true
          git push origin master
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
