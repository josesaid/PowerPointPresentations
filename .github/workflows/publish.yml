# Descarga el workflow corregido
cat > .github/workflows/publish.yml << 'EOF'
name: Auto-Publish LinkedIn + dev.to + GitHub

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Publish to dev.to
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          python3 << 'PYTHON_EOF'
          import requests
          import os
          
          api_key = os.environ.get('DEVTO_API_KEY')
          
          # Read article from current directory
          try:
              with open('article_EN.md', 'r') as f:
                  content = f.read()
              print(f"✅ Read article_EN.md ({len(content)} chars)")
          except FileNotFoundError as e:
              print(f"❌ File not found: {e}")
              print("Files in current directory:")
              import os
              for f in os.listdir('.'):
                  print(f"  - {f}")
              exit(1)
          
          # Extract title
          title = None
          for line in content.split('\n'):
              if line.startswith('# '):
                  title = line.replace('# ', '').strip()
                  break
          
          if not title:
              print("❌ Could not extract title")
              exit(1)
          
          print(f"📝 Title: {title}")
          
          headers = {
              'api-key': api_key,
              'Content-Type': 'application/json'
          }
          
          payload = {
              'article': {
                  'title': title,
                  'body_markdown': content,
                  'published': True,
                  'tags': ['database', 'architecture', 'microservices', 'scaling']
              }
          }
          
          try:
              response = requests.post(
                  'https://dev.to/api/articles',
                  json=payload,
                  headers=headers,
                  timeout=10
              )
              
              if response.status_code == 201:
                  data = response.json()
                  article_url = f"https://dev.to/said_olano/{data['slug']}"
                  print(f"✅ Published to dev.to")
                  print(f"   {article_url}")
              else:
                  print(f"❌ API Error: {response.status_code}")
                  print(response.text)
                  exit(1)
          except Exception as e:
              print(f"❌ Exception: {e}")
              exit(1)
          PYTHON_EOF

      - name: Commit PDFs
        run: |
          git config --global user.email "josesaid@gmail.com"
          git config --global user.name "Said Olano"
          git add *.pdf || true
          git commit -m "Update PDFs - $(date +%Y-%m-%d)" || echo "No changes"
          git push || echo "Push skipped"
EOF

# Commit y push
git add .github/workflows/publish.yml
git commit -m "Fix workflow - improve file detection"
git push
