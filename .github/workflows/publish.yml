name: Auto-Publish LinkedIn + dev.to + GitHub

on:
  schedule:
    # Diariamente a las 2 PM UTC (10 AM EST)
    - cron: '0 14 * * *'

  # Trigger manual
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Publish to dev.to
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          python << 'PYTHON_EOF'
          import requests
          import os
          from datetime import datetime

          api_key = os.environ.get('DEVTO_API_KEY')

          # Read article
          try:
              with open('article_EN.md') as f:
                  content = f.read()
          except:
              print("❌ article_EN.md not found")
              exit(1)

          # Extract title
          title = None
          for line in content.split('\n'):
              if line.startswith('# '):
                  title = line.replace('# ', '').strip()
                  break

          if not title:
              print("❌ Could not extract title")
              exit(1)

          headers = {
              'api-key': api_key,
              'Content-Type': 'application/json'
          }

          payload = {
              'article': {
                  'title': title,
                  'body_markdown': content,
                  'published': True,
                  'tags': ['database', 'architecture', 'microservices', 'scaling']
              }
          }

          try:
              response = requests.post(
                  'https://dev.to/api/articles',
                  json=payload,
                  headers=headers,
                  timeout=10
              )

              if response.status_code == 201:
                  data = response.json()
                  article_url = f"https://dev.to/said_olano/{data['slug']}"
                  print(f"✅ Published to dev.to: {article_url}")
                  with open('devto_url.txt', 'w') as f:
                      f.write(article_url)
              else:
                  print(f"❌ API Error: {response.status_code}")
                  print(response.text)
                  exit(1)
          except Exception as e:
              print(f"❌ Exception: {e}")
              exit(1)
          PYTHON_EOF

      - name: Commit PDFs to GitHub
        run: |
          git config --global user.email "josesaid@gmail.com"
          git config --global user.name "Said Olano"
          git add *.pdf || echo "No PDFs to add"
          git commit -m "Add published PDFs - $(date +%Y-%m-%d)" || echo "No changes"
          git push || echo "Push failed - check permissions"

      - name: Create report
        if: always()
        run: |
          echo "✅ Pipeline execution completed"
          echo "Check: https://dev.to/said_olano"
          echo "Check: https://github.com/${{ github.repository }}/actions"
